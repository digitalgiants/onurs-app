services:
  web:
    build:
      context: ..
      dockerfile: container/Dockerfile
    image: houston-pro-handyman:latest
    container_name: houston-pro-handyman
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3005/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
