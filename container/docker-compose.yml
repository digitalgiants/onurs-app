services:
  web:
    build:
      context: ..
      dockerfile: container/Dockerfile
    image: houston-pro-handyman:latest
    container_name: houston-pro-handyman
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
